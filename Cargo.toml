[workspace]
resolver = "2"
members = ["core/*", "cpus/*", "gpus/*", "cpus/arm64/gen", "cpus/arm32/analyze", "cpus/arm32/gen", "cpus/mips/gen", "cpus/rsp/gen", "cpus/sm83/gen", "cpus/z80/gen", "guests/*/*", "override/*", "relift", "testguest"]
exclude = ["check", "guests/gb/devices"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/USA-RedDragon/relift"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
relift-analyze = { path = "core/analyze" }
relift-build = { path = "core/build" }
relift-cache = { path = "core/cache" }
relift-cpu-arm64 = { path = "cpus/arm64" }
relift-cpu-arm32 = { path = "cpus/arm32" }
relift-cpu-arm32-analyze = { path = "cpus/arm32/analyze" }
relift-cpu-mips = { path = "cpus/mips" }
relift-cpu-rsp = { path = "cpus/rsp" }
relift-cpu-sm83 = { path = "cpus/sm83" }
relift-gpu-nv = { path = "gpus/nv" }
relift-gpu-sm53 = { path = "gpus/sm53" }
relift-gpu-sm86 = { path = "gpus/sm86" }
relift-cpu-z80 = { path = "cpus/z80" }
relift-gb = { path = "guests/gb/guest" }
relift-gb-analyze = { path = "guests/gb/analyze" }
relift-gb-formats = { path = "guests/gb/formats" }
relift-gb-tools = { path = "guests/gb/tools" }
relift-gba = { path = "guests/gba/guest" }
relift-gba-analyze = { path = "guests/gba/analyze" }
relift-gba-formats = { path = "guests/gba/formats" }
relift-gba-tools = { path = "guests/gba/tools" }
relift-nds = { path = "guests/nds/guest" }
relift-nds-analyze = { path = "guests/nds/analyze" }
relift-nds-formats = { path = "guests/nds/formats" }
relift-nds-tools = { path = "guests/nds/tools" }
relift-sms = { path = "guests/sms/guest" }
relift-sms-formats = { path = "guests/sms/formats" }
relift-sms-tools = { path = "guests/sms/tools" }
relift-emit = { path = "core/emit" }
relift-emit-wasm = { path = "core/emit-wasm" }
relift-guest = { path = "core/guest" }
relift-host = { path = "core/host" }
relift-info = { path = "core/info" }
relift-input = { path = "core/input" }
relift-ir = { path = "core/ir" }
relift-manifest = { path = "core/manifest" }
relift-n64 = { path = "guests/n64/guest" }
relift-n64-analyze = { path = "guests/n64/analyze" }
relift-n64-formats = { path = "guests/n64/formats" }
relift-n64-tools = { path = "guests/n64/tools" }
relift-override = { path = "override/api" }
relift-override-macros = { path = "override/macros" }
relift-proc = { path = "core/proc" }
relift-diff = { path = "core/diff" }
relift-patch = { path = "core/patch" }
relift-progress = { path = "core/progress" }
relift-sail = { path = "core/sail" }
relift-switch = { path = "guests/switch/guest" }
relift-switch-fonts = { path = "guests/switch/fonts" }
relift-switch-formats = { path = "guests/switch/formats" }
relift-switch-names = { path = "guests/switch/names" }
relift-switch-tools = { path = "guests/switch/tools" }
relift-switch-vkgen = { path = "guests/switch/vkgen" }
relift-switch-shaders = { path = "guests/switch/shaders" }
relift-testguest = { path = "testguest" }

clap = { version = "=4.6.7", features = ["derive"] }
configulator-rs = "=0.4.1"
cpp_demangle = "=0.5.1"
encoding_rs = "=0.8.44"
lzma-rs = { version = "=0.3.0", default-features = false }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
read-fonts = "=0.47.0"
roxmltree = "=0.21.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uds_windows = "=1.2.1"
sha2 = "=0.11.1"
skera = { version = "=0.10.0", default-features = false }
skrifa = "=0.50.0"
toml = "=1.2.1"
wasm-encoder = { version = "=0.263.0", default-features = false }
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }
write-fonts = "=0.56.0"
zstd = { version = "=0.14.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
