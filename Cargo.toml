[workspace]
resolver = "2"
members = ["core/*", "cpus/*", "cpus/a64/gen", "guests/*/*", "override/*", "relift", "testguest"]
exclude = ["check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/USA-RedDragon/relift"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
relift-analyze = { path = "core/analyze" }
relift-build = { path = "core/build" }
relift-cache = { path = "core/cache" }
relift-cpu-a64 = { path = "cpus/a64" }
relift-gb-formats = { path = "guests/gb/formats" }
relift-emit = { path = "core/emit" }
relift-guest = { path = "core/guest" }
relift-host = { path = "core/host" }
relift-ir = { path = "core/ir" }
relift-manifest = { path = "core/manifest" }
relift-override = { path = "override/api" }
relift-override-macros = { path = "override/macros" }
relift-proc = { path = "core/proc" }
relift-switch = { path = "guests/switch/guest" }
relift-switch-formats = { path = "guests/switch/formats" }
relift-switch-names = { path = "guests/switch/names" }
relift-switch-tools = { path = "guests/switch/tools" }
relift-switch-vkgen = { path = "guests/switch/vkgen" }
relift-testguest = { path = "testguest" }

clap = { version = "=4.6.7", features = ["derive"] }
configulator-rs = "=0.4.1"
cpp_demangle = "=0.5.1"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
roxmltree = "=0.21.2"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
toml = "=1.2.1"
zstd = { version = "=0.14.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
