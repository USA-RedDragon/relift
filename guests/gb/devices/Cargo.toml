[package]
name = "relift-gb-devices"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/USA-RedDragon/relift"
publish = false
description = "rustyboi-core's Game Boy devices behind a C ABI, for the relift Game Boy runtime"

[workspace]

[lib]
name = "relift_gb_devices"
crate-type = ["staticlib", "rlib"]

[features]
default = ["interpreter"]
# rustyboi's CPU interpreter: rlgbd_exec_native and rlgbd_step_native, for
# development builds (code not lifted yet, the lockstep check) and the tests.
# Release programs leave it out: every instruction they run is lifted.
interpreter = ["rustyboi-core/interpreter"]

[[test]]
name = "abi"
required-features = ["interpreter"]

[[test]]
name = "case"
required-features = ["interpreter"]

[[test]]
name = "ext_abi"
required-features = ["interpreter"]

[[example]]
name = "corpus_case"
required-features = ["interpreter"]

[dependencies]
rustyboi-core = { git = "https://github.com/USA-RedDragon/rustyboi", rev = "b6687f38120bd81c2251519e54f1c40f6002c9ef", default-features = false }
flate2 = "=1.1.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
