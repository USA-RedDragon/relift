[package]
name = "relift-gb-analyze"
description = "Function discovery across mapper banks: code locations are (bank, address), bank-register writes are tracked along paths, bank-switch trampolines are found and resolved at their call sites, pointers stored in RAM and jump tables in ROM are followed along proven load and store paths, a computed jump that depends on one entry register is resolved by running the function for each of its 256 values, jumps into RAM are reported; decode and control flow only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.relift]
band = "2"

[dependencies]
relift-cpu-sm83 = { workspace = true }
relift-gb-formats = { workspace = true }
relift-proc = { workspace = true }

[lints]
workspace = true
