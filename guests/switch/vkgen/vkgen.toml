# relift-vkgen configuration for the public runtime: core Vulkan 1.0 to 1.3
# plus the extensions below. A game repository may pass a second file with
# more extensions (lists concatenate).

[registry]
tag = "v1.4.363"
url = "https://raw.githubusercontent.com/KhronosGroup/Vulkan-Headers/v1.4.363/registry/vk.xml"
sha256 = "55ec60950cfb18c3575dcf5fd52741b2bb70eb1e466408f803a91049973ee6fb"

[api]
features = ["VK_VERSION_1_0", "VK_VERSION_1_1", "VK_VERSION_1_2", "VK_VERSION_1_3"]
extensions = [
    "VK_KHR_surface",
    "VK_KHR_swapchain",
    "VK_NN_vi_surface",
    "VK_EXT_debug_utils",
    "VK_EXT_debug_report",
    "VK_EXT_debug_marker",
    "VK_KHR_get_physical_device_properties2",
    "VK_KHR_get_surface_capabilities2",
    "VK_KHR_maintenance1",
    "VK_KHR_maintenance2",
    "VK_KHR_maintenance3",
    "VK_KHR_bind_memory2",
    "VK_KHR_get_memory_requirements2",
    "VK_KHR_dedicated_allocation",
    "VK_KHR_descriptor_update_template",
    "VK_KHR_push_descriptor",
    "VK_KHR_sampler_ycbcr_conversion",
    "VK_KHR_create_renderpass2",
    "VK_KHR_depth_stencil_resolve",
    "VK_KHR_timeline_semaphore",
    "VK_KHR_draw_indirect_count",
    "VK_KHR_dynamic_rendering",
    "VK_KHR_synchronization2",
    "VK_KHR_copy_commands2",
    "VK_KHR_external_memory_capabilities",
    "VK_KHR_external_semaphore_capabilities",
    "VK_KHR_external_fence_capabilities",
    "VK_KHR_device_group_creation",
    "VK_EXT_extended_dynamic_state",
    "VK_EXT_extended_dynamic_state2",
    "VK_EXT_sample_locations",
    "VK_EXT_discard_rectangles",
    "VK_EXT_hdr_metadata",
]
# Used by the runtime on the host only; the guest never sees them.
host_extensions = [
    "VK_KHR_map_memory2",
    "VK_EXT_map_memory_placed",
    "VK_EXT_external_memory_host",
    "VK_EXT_headless_surface",
    "VK_EXT_depth_bias_control",
]

[thunks]
# Written by hand in runtime/guests/switch/vk/ as vkh_<name>.
hand_commands = [
    "vkGetInstanceProcAddr",
    "vkGetDeviceProcAddr",
    "vkCreateInstance",
    "vkDestroyInstance",
    "vkEnumerateInstanceExtensionProperties",
    "vkEnumerateDeviceExtensionProperties",
    "vkGetPhysicalDeviceQueueFamilyProperties",
    "vkGetPhysicalDeviceQueueFamilyProperties2",
    "vkGetDeviceQueue",
    "vkGetDeviceQueue2",
    "vkEnumeratePhysicalDevices",
    "vkEnumeratePhysicalDeviceGroups",
    "vkEnumerateInstanceVersion",
    "vkGetPhysicalDeviceProperties",
    "vkGetPhysicalDeviceProperties2",
    "vkGetPhysicalDeviceFeatures",
    "vkGetPhysicalDeviceFeatures2",
    "vkGetPhysicalDeviceMemoryProperties",
    "vkGetPhysicalDeviceMemoryProperties2",
    "vkGetPhysicalDeviceFormatProperties",
    "vkGetPhysicalDeviceFormatProperties2",
    "vkGetPhysicalDeviceImageFormatProperties",
    "vkGetPhysicalDeviceImageFormatProperties2",
    "vkCreateDevice",
    "vkDestroyDevice",
    "vkAllocateMemory",
    "vkFreeMemory",
    "vkMapMemory",
    "vkUnmapMemory",
    "vkFlushMappedMemoryRanges",
    "vkInvalidateMappedMemoryRanges",
    "vkCreateBuffer",
    "vkCreateImage",
    "vkBindImageMemory",
    "vkBindImageMemory2",
    "vkCreateImageView",
    "vkCmdCopyBufferToImage",
    "vkCmdCopyBufferToImage2",
    "vkCmdCopyImage",
    "vkCmdCopyImage2",
    "vkCmdCopyImageToBuffer",
    "vkCmdCopyImageToBuffer2",
    "vkCreateDescriptorPool",
    "vkDestroyDescriptorPool",
    "vkResetDescriptorPool",
    "vkAllocateDescriptorSets",
    "vkFreeDescriptorSets",
    "vkQueueSubmit",
    "vkQueueSubmit2",
    "vkBeginCommandBuffer",
    "vkCreateDescriptorSetLayout",
    "vkGetDescriptorSetLayoutSupport",
    "vkCreateRenderPass",
    "vkCreateRenderPass2",
    "vkCmdBeginRendering",
    "vkCreateGraphicsPipelines",
    "vkCreateShaderModule",
    "vkCmdSetDepthBias",
    "vkAllocateCommandBuffers",
    "vkFreeCommandBuffers",
    "vkDestroyCommandPool",
    "vkCreateViSurfaceNN",
    "vkCreateDebugUtilsMessengerEXT",
    "vkDestroyDebugUtilsMessengerEXT",
    "vkCreateDebugReportCallbackEXT",
    "vkDestroyDebugReportCallbackEXT",
    "vkGetPhysicalDeviceSurfaceCapabilitiesKHR",
    "vkGetPhysicalDeviceSurfaceCapabilities2KHR",
    "vkGetPhysicalDeviceSurfacePresentModesKHR",
    "vkGetPhysicalDeviceSurfaceFormatsKHR",
    "vkGetPhysicalDeviceSurfaceSupportKHR",
    "vkGetPhysicalDeviceSurfaceFormats2KHR",
    "vkGetPhysicalDevicePresentRectanglesKHR",
    "vkGetDeviceGroupSurfacePresentModesKHR",
    "vkDestroySurfaceKHR",
    "vkCreateSwapchainKHR",
    "vkDestroySwapchainKHR",
    "vkGetSwapchainImagesKHR",
    "vkAcquireNextImageKHR",
    "vkAcquireNextImage2KHR",
    "vkQueuePresentKHR",
]
# Written by hand as vkh_in_<name> and vkh_out_<name> (they hold guest callbacks).
hand_structs = ["VkDebugUtilsMessengerCreateInfoEXT", "VkDebugReportCallbackCreateInfoEXT"]
# Always NULL on the host: the host driver allocates with its own allocator.
drop_types = ["VkAllocationCallbacks"]

# Shadow-mapped memory: copy guest writes to the host before work reaches the
# GPU, and host-cached results back after the guest waits for it.
[hooks.before]
vkQueueSubmit = "vkf_queue_enter"
vkQueueSubmit2 = "vkf_queue_enter"
vkQueueBindSparse = "vkf_queue_enter"
vkQueuePresentKHR = "vkf_shadow_flush"
vkQueueWaitIdle = "vkf_queue_wait_enter"
vkDeviceWaitIdle = "vkf_queue_wait_enter"
vkWaitForFences = "vkf_fences_wait_enter"
vkWaitSemaphores = "vkf_semaphores_wait_enter"

[hooks.after]
vkQueueSubmit = "vkf_queue_unlock"
vkQueueSubmit2 = "vkf_queue_unlock"
vkQueueBindSparse = "vkf_queue_unlock"
vkWaitForFences = "vkf_wait_pull_return"
vkGetFenceStatus = "vkf_shadow_pull"
vkQueueWaitIdle = "vkf_queue_wait_return"
vkDeviceWaitIdle = "vkf_queue_wait_return"
vkWaitSemaphores = "vkf_wait_pull_return"
vkGetBufferMemoryRequirements = "vkf_mem_reqs_out"
vkGetImageMemoryRequirements = "vkf_image_reqs_out"
vkGetBufferMemoryRequirements2 = "vkf_mem_reqs2_out"
vkGetImageMemoryRequirements2 = "vkf_image_reqs2_out"
vkGetDeviceBufferMemoryRequirements = "vkf_mem_reqs2_out"
vkGetDeviceImageMemoryRequirements = "vkf_mem_reqs2_out"
vkCreateDescriptorSetLayout = "vkf_note_set_layout"
vkDestroyDescriptorSetLayout = "vkf_forget_set_layout"
# Images in a decoded format and the uploads to them (vk_image.c).
vkDestroyImage = "vkf_image_destroyed"
vkBindBufferMemory = "vkf_buffer_bound"
vkBindBufferMemory2 = "vkf_buffers_bound"
vkDestroyBuffer = "vkf_buffer_destroyed"
vkCmdExecuteCommands = "vkf_note_execute"
vkResetCommandBuffer = "vkf_cb_reset_hook"
vkResetCommandPool = "vkf_pool_reset_hook"
# Depth attachments that reach the host as D32 and the depth bias for them (vk_format.c).
vkDestroyRenderPass = "vkf_depth_forget_pass"
vkDestroyImageView = "vkf_depth_forget_view"
vkCmdBeginRenderPass = "vkf_depth_begin_pass"
vkCmdBeginRenderPass2 = "vkf_depth_begin_pass"
vkCmdNextSubpass = "vkf_depth_next_subpass"
vkCmdNextSubpass2 = "vkf_depth_next_subpass"
vkCmdEndRenderPass = "vkf_depth_end_pass"
vkCmdEndRenderPass2 = "vkf_depth_end_pass"
vkCmdEndRendering = "vkf_depth_end_pass"

# Fail a call that goes past a host limit below the Switch's (vk_props.c).
[hooks.check]
vkCreateDescriptorSetLayout = "vkf_check_set_layout"
vkCreatePipelineLayout = "vkf_check_pipeline_layout"
vkCreateFramebuffer = "vkf_check_framebuffer"
