[package]
name = "relift-switch-shaders"
description = "`relift-shaders scan`: finds every NVIDIA SM86 shader program in a NUP or an extracted tree (zstd with the game's dictionaries, SARC, BNSH, agl BAHS, sead bin, KTGL rdb/fdata, NSO), deduplicated, cached per file and parallel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.relift]
band = "2"

[dependencies]
clap = { workspace = true }
relift-gpu-sm86 = { workspace = true }
relift-cache = { workspace = true }
relift-proc = { workspace = true }
relift-switch-formats = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "relift-shaders"
path = "src/bin/relift-shaders.rs"
