[package]
name = "relift-n64-tools"
description = "`relift-n64rom`: `info` prints byte order, header, boot variant and checksum check as text or JSON, `streams` lists the compressed streams, `normalize` writes a big-endian image, `functions` runs `relift-n64-analyze`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.relift]
band = "2"

[dependencies]
clap = { workspace = true }
relift-cache = { workspace = true }
relift-n64-analyze = { workspace = true }
relift-n64-formats = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
relift-cache = { workspace = true }
relift-n64-formats = { workspace = true }
relift-proc = { workspace = true }
serde_json = { workspace = true }
