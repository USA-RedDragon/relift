[package]
name = "relift-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/USA-RedDragon/relift"
publish = false

[workspace]

[dependencies]
relift-cpu-arm64 = { path = "../cpus/arm64" }
relift-cpu-mips = { path = "../cpus/mips" }
relift-cpu-sm83 = { path = "../cpus/sm83" }
relift-cpu-z80 = { path = "../cpus/z80" }
relift-cache = { path = "../core/cache" }
relift-diff = { path = "../core/diff" }
relift-guest = { path = "../core/guest" }
relift-ir = { path = "../core/ir" }
relift-proc = { path = "../core/proc" }
rustyboi-core = { git = "https://github.com/USA-RedDragon/rustyboi", rev = "b6687f38120bd81c2251519e54f1c40f6002c9ef" }
unicorn-engine = { version = "=2.1.5", default-features = false, features = ["arch_aarch64"] }

[lints.rust]
unsafe_code = "forbid"
