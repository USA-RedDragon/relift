repos:
  - repo: https://github.com/USA-RedDragon/configulator-rs
    rev: v0.4.1
    hooks:
      - id: configulator-sample
        args: [--dir, relift, --type, Settings, --format, toml, --sample-file, relift.example.toml]
      - id: configulator-markdown
        args: [--dir, relift, --type, Settings, --markdown-file, README.md, --env-prefix, RELIFT_]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
