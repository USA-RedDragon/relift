[package]
name = "relift-gpu-apigen"
description = "`relift-vkgen`: generates the GPU-API forwarding C (Vulkan for AArch64 and i386 guests, OpenGL, GLX and EGL for i386) from the pinned Khronos registries; nothing depends on it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.relift]
band = "2"

[dependencies]
clap = { workspace = true }
relift-cache = { workspace = true }
roxmltree = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "relift-vkgen"
path = "src/main.rs"
