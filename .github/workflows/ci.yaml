name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The AppImage type 2 runtime relift packages with: the tag and x86_64 hash
  # of relift/src/appimage_runtime.rs, the cache key; scripts/ci/appimage.sh
  # checks the tag.
  APPIMAGE_RUNTIME_TAG: "20251108"
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  workflows:
    name: workflow files parse and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        run: scripts/ci/workflows.sh

  lint:
    name: fmt, clippy, charter, generated docs and Vulkan forwarding, deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          workspaces: |
            .
            check
            guests/gb/devices

      - name: fmt, clippy, charter, generated docs and Vulkan forwarding, deny
        run: scripts/ci/lint.sh

  tests-workspace:
    name: tests of every crate but relift and the GB devices, SPIR-V validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-workspace
          workspaces: |
            .

      - name: tests of every crate but relift and the GB devices, SPIR-V validation
        run: scripts/ci/tests-workspace.sh

  tests-gb-devices:
    name: Game Boy devices tests, release profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-gb-devices
          workspaces: |
            guests/gb/devices

      - name: Game Boy devices tests, release profile
        run: scripts/ci/tests-gb-devices.sh

  tests-relift:
    name: tests of relift, without the end-to-end targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-relift
          workspaces: |
            .

      - name: tests of relift, without the end-to-end targets
        run: scripts/ci/tests-relift.sh

  tests-relift-e2e:
    name: end-to-end tests of relift (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [slow, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-relift-e2e-${{ matrix.part }}
          workspaces: |
            .

      - name: Restore the cached packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-lavapipe-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
          restore-keys: apt-lavapipe-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Mesa's lavapipe for the N64 picture test
        run: |
          scripts/ci/apt-install.sh mesa-vulkan-drivers libvulkan1
          echo "RELIFT_VK_REQUIRE=1" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"

      - name: end-to-end tests of relift
        run: scripts/ci/tests-relift-e2e.sh ${{ matrix.part }}

  nds-timing-sdk:
    name: Nintendo DS timing test ROM, devkitPro build (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [timing, arb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: nds-timing-sdk-${{ matrix.part }}
          workspaces: |
            .

      - name: Build the ROM in the devkitPro image, run it through relift and compare
        run: scripts/ci/nds-timing-sdk.sh ${{ matrix.part }}

  docs:
    name: docs facts are current and the site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs

      - name: Check the generated facts and build the site
        run: scripts/ci/docs.sh

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: artifacts/docs-site
          if-no-files-found: error
          retention-days: 14

      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/docs-site

  pages:
    name: publish the docs site to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  mesh-kat:
    name: task, mesh and compute known answers on lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the cached packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-mesa-build-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-mesa-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Install what the pinned lavapipe build and the known answers need
        run: |
          scripts/ci/apt-install.sh llvm-dev ninja-build bison flex glslang-tools \
            python3-mako python3-yaml python3-packaging zlib1g-dev libexpat1-dev libzstd-dev libdrm-dev \
            pkg-config libvulkan-dev cmake

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the pinned lavapipe and spirv-val
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lavapipe-*
            ${{ runner.temp }}/spirv-tools-*
            ${{ runner.temp }}/vulkan-headers-*
          key: mesh-kat-${{ hashFiles('scripts/ci/lib.sh') }}

      - name: Draw the recorded programs with both back ends, then run the compute ones
        run: scripts/ci/mesh-kat.sh

  gb-corpus:
    name: Game Boy corpus subset through relift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            guests/gb/devices

      - name: Import, build and run the cases of runtime/guests/gb/devtests/ci_cases.toml
        run: scripts/ci/gb-corpus.sh

  z80-sst:
    name: Z80 templates against SingleStepTests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: check

      - name: Run the SingleStepTests z80 v1 set and the mutation control
        run: scripts/ci/z80-sst.sh

  z80-zexdoc:
    name: ZEXDOC as emitted C
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lift, emit, compile and run ZEXDOC
        run: scripts/ci/z80-zexdoc.sh

  appimage:
    name: AppImage packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the pinned AppImage runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/relift/sdk/appimage-runtime
          key: appimage-runtime-${{ env.APPIMAGE_RUNTIME_TAG }}-${{ env.APPIMAGE_RUNTIME_SHA256 }}

      - name: Package four programs at once
        run: scripts/ci/appimage.sh

  generated:
    name: generated templates are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: regenerate the Sail templates and compare
        run: scripts/ci/generated.sh

  macos-workspace:
    name: tests of every crate but relift (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-workspace
          workspaces: |
            .

      - name: tests of every crate but relift (macOS)
        run: scripts/ci/tests.sh workspace

  macos-relift:
    name: tests of relift, without the end-to-end targets (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-relift
          workspaces: |
            .

      - name: tests of relift, without the end-to-end targets (macOS)
        run: scripts/ci/tests.sh relift

  macos-relift-e2e-slow:
    name: the slowest end-to-end tests of relift (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-relift-e2e-slow
          workspaces: |
            .

      - name: the slowest end-to-end tests of relift (macOS)
        run: scripts/ci/tests.sh e2e-slow

  macos-relift-e2e-rest:
    name: the other end-to-end tests of relift (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-relift-e2e-rest
          workspaces: |
            .

      - name: the other end-to-end tests of relift (macOS)
        run: scripts/ci/tests.sh e2e-rest

  cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is 4.3 GiB compressed and 14.8 GiB unpacked, and the build
      # in it adds under 1 GiB: 25 GiB with the margin for the pull's
      # compressed layers. The runner image has 88 GiB free, so the step
      # normally does nothing; on a runner with less it deletes the
      # preinstalled toolchains in parallel. A job-level `container:` is
      # pulled before any step runs, so the image is run with `docker run`.
      - name: Free disk for the cross image
        run: scripts/ci/free-disk.sh 25

      - name: Build relift for ${{ matrix.target }}
        run: scripts/ci/cross-image.sh "${{ matrix.target }}"
