name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The AppImage type 2 runtime relift packages with: the tag and x86_64 hash
  # of relift/src/appimage_runtime.rs, the cache key; scripts/ci/appimage.sh
  # checks the tag.
  APPIMAGE_RUNTIME_TAG: "20251108"
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  workflows:
    name: workflow files parse and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        run: scripts/ci/workflows.sh

  lint:
    name: fmt, clippy, charter, generated docs and Vulkan forwarding, deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          workspaces: |
            .
            check
            guests/gb/devices

      - name: fmt, clippy, charter, generated docs and Vulkan forwarding, deny
        run: scripts/ci/lint.sh

  tests-workspace:
    name: tests of every crate but relift and the GB devices, SPIR-V validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-workspace
          workspaces: |
            .

      - name: tests of every crate but relift and the GB devices, SPIR-V validation
        run: scripts/ci/tests-workspace.sh

  tests-gb-devices:
    name: Game Boy devices tests, release profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-gb-devices
          workspaces: |
            guests/gb/devices

      - name: Game Boy devices tests, release profile
        run: scripts/ci/tests-gb-devices.sh

  tests-relift:
    name: tests of relift, without the end-to-end targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-relift
          workspaces: |
            .

      - name: tests of relift, without the end-to-end targets
        run: scripts/ci/tests-relift.sh

  tests-relift-e2e:
    name: end-to-end tests of relift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-relift-e2e
          workspaces: |
            .

      - name: Install Mesa's lavapipe for the N64 picture test
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1
          echo "RELIFT_VK_REQUIRE=1" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"

      - name: end-to-end tests of relift
        run: scripts/ci/tests-relift-e2e.sh

  docs:
    name: docs facts are current and the site builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Check the generated facts and build the site
        run: scripts/ci/docs.sh

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: artifacts/docs-site
          if-no-files-found: error
          retention-days: 14

  mesh-kat:
    name: task and mesh known answers on lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install what the pinned lavapipe build and the known answers need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-dev ninja-build bison flex glslang-tools \
            python3-mako python3-yaml python3-packaging zlib1g-dev libexpat1-dev libzstd-dev libdrm-dev \
            pkg-config libvulkan-dev cmake

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the pinned lavapipe and spirv-val
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lavapipe-*
            ${{ runner.temp }}/spirv-tools-*
          key: mesh-kat-${{ hashFiles('scripts/ci/lib.sh') }}

      - name: Draw the recorded programs with both back ends
        run: scripts/ci/mesh-kat.sh

  gb-corpus:
    name: Game Boy corpus subset through relift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            guests/gb/devices

      - name: Import, build and run the cases of runtime/guests/gb/devtests/ci_cases.toml
        run: scripts/ci/gb-corpus.sh

  z80-sst:
    name: Z80 templates against SingleStepTests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: check

      - name: Run the SingleStepTests z80 v1 set and the mutation control
        run: scripts/ci/z80-sst.sh

  z80-zexdoc:
    name: ZEXDOC as emitted C
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lift, emit, compile and run ZEXDOC
        run: scripts/ci/z80-zexdoc.sh

  appimage:
    name: AppImage packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          clang --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache the pinned AppImage runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/relift/sdk/appimage-runtime
          key: appimage-runtime-${{ env.APPIMAGE_RUNTIME_TAG }}-${{ env.APPIMAGE_RUNTIME_SHA256 }}

      - name: Package four programs at once
        run: scripts/ci/appimage.sh

  generated:
    name: generated templates are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: regenerate the Sail templates and compare
        run: scripts/ci/generated.sh

  macos:
    name: tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: tests
        run: scripts/ci/tests.sh

  cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is about 4.3 GiB compressed and 16 GB unpacked, more than a
      # hosted runner has free. A job-level `container:` is pulled before any
      # step runs, so the image is run with `docker run` after this step.
      - name: Free disk for the cross image
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Build relift for ${{ matrix.target }}
        run: scripts/ci/cross-image.sh "${{ matrix.target }}"
