name: Runtime

on:
  push:
    branches: [main]
    paths:
      - runtime/**
      - scripts/ci/lib.sh
      - scripts/ci/runtime-*.sh
      - .github/workflows/runtime.yaml
  pull_request:
    paths:
      - runtime/**
      - scripts/ci/lib.sh
      - scripts/ci/runtime-*.sh
      - .github/workflows/runtime.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charter:
    name: C runtime charter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Core names no guest OS or CPU; Vulkan types hold the guest layout
        run: scripts/ci/runtime-charter.sh

  c-tests:
    name: C runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mesa's lavapipe for the Vulkan forwarding tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1
          echo "RELIFT_VK_REQUIRE=1" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"

      - name: Install gdb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb

      - name: Build the runtime and run its tests in every layout
        run: scripts/ci/runtime-tests.sh
