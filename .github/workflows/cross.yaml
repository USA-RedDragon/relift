name: Cross

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-guard:
    name: release builds load no code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The guard rejects what it should; the runtime sources load no code
        run: scripts/ci/release-guard.sh

  linux:
    name: cross ${{ matrix.guest }} ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        guest: [gb, gba, n64, nds, sms]
        target: [windows-x64, windows-arm64, android-arm64]
        include:
          - target: windows-x64
            rust: x86_64-pc-windows-gnullvm
          - target: windows-arm64
            rust: aarch64-pc-windows-gnullvm
          - target: android-arm64
            rust: aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            guests/gb/devices

      - name: Install the Rust std for the target
        run: rustup target add ${{ matrix.rust }}

      - name: Restore the zig archive
        if: startsWith(matrix.target, 'windows-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zig-x86_64-linux-*.tar.xz
          key: zig-${{ hashFiles('scripts/ci/lib.sh') }}

      - name: Install zig
        if: startsWith(matrix.target, 'windows-')
        run: scripts/ci/install-zig.sh

      - name: Restore the wine packages
        id: wine-cache
        if: matrix.target == 'windows-x64'
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wine-debs
          key: wine-debs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: wine-debs-${{ runner.os }}-

      - name: Install wine to run the Windows program
        id: wine
        if: matrix.target == 'windows-x64'
        timeout-minutes: 5
        run: scripts/ci/wine.sh "$RUNNER_TEMP/wine-debs"

      - name: Save the wine packages it downloaded
        if: matrix.target == 'windows-x64' && steps.wine.outputs.downloaded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wine-debs
          key: wine-debs-${{ runner.os }}-${{ github.run_id }}-${{ matrix.guest }}

      - name: Show the Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          echo "$ANDROID_NDK_HOME"
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Cross-build the runtime and a program of the guest, check the release, run it
        run: scripts/ci/gbcross.sh "${{ matrix.target }}" --guest "${{ matrix.guest }}"

  macos:
    name: cross ${{ matrix.guest }} ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        guest: [gb, gba, n64, nds, sms]
        target: [macos-x64, ios-arm64]
        include:
          - target: macos-x64
            rust: x86_64-apple-darwin
          - target: ios-arm64
            rust: aarch64-apple-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust }}
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-debug
          workspaces: |
            .
            guests/gb/devices

      - name: Cross-build the runtime and a program of the guest, check the release
        run: scripts/ci/gbcross.sh "${{ matrix.target }}" --guest "${{ matrix.guest }}"
